<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <rect width="760" height="300" fill="#ffffff"/>

  <!-- ESP -->
  <rect x="30" y="70" width="190" height="150" rx="10" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <text x="125" y="100" text-anchor="middle" font-weight="bold">M5Stack Atom Lite</text>
  <text x="125" y="122" text-anchor="middle" fill="#555">ESP32-PICO-D4</text>
  <text x="125" y="160" text-anchor="middle">GPIO19 → TX</text>
  <text x="125" y="182" text-anchor="middle">GPIO22 ← RX</text>
  <text x="125" y="206" text-anchor="middle" fill="#555">USB-C 5 V</text>

  <!-- base -->
  <rect x="280" y="70" width="190" height="150" rx="10" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <text x="375" y="100" text-anchor="middle" font-weight="bold">Atomic RS485 Base</text>
  <text x="375" y="122" text-anchor="middle" fill="#555">auto direction</text>
  <text x="455" y="158" text-anchor="end">A</text>
  <text x="455" y="183" text-anchor="end">B</text>
  <text x="455" y="208" text-anchor="end">GND</text>

  <!-- stacking -->
  <line x1="220" y1="145" x2="280" y2="145" stroke="#333" stroke-width="2"/>
  <text x="250" y="137" text-anchor="middle" fill="#555" font-size="12">stacked</text>

  <!-- fancoil -->
  <rect x="560" y="70" width="170" height="150" rx="10" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <text x="645" y="100" text-anchor="middle" font-weight="bold">Fancoil</text>
  <text x="645" y="122" text-anchor="middle" fill="#555">MD1001 board</text>
  <text x="575" y="158">A</text>
  <text x="575" y="183">B</text>
  <text x="575" y="208">GND</text>

  <!-- wires -->
  <line x1="470" y1="153" x2="560" y2="153" stroke="#2e7d32" stroke-width="3"/>
  <line x1="470" y1="178" x2="560" y2="178" stroke="#1565c0" stroke-width="3"/>
  <line x1="470" y1="203" x2="560" y2="203" stroke="#333" stroke-width="3" stroke-dasharray="6 4"/>

  <text x="380" y="260" text-anchor="middle" fill="#555" font-size="13">Modbus RTU · 9600 8N1 · slave 15 · twisted pair for A/B</text>
</svg>
